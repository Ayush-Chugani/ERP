components:
  schemas:
    AcademicTerm:
      type: object
      properties:
        academic_term_id:
          type: integer
          readOnly: true
        academic_year_id:
          type: integer
          maximum: 65535
          minimum: 1
        term_code:
          type: string
          maxLength: 20
        term_name:
          type: string
          maxLength: 100
        term_type:
          $ref: '#/components/schemas/TermTypeEnum'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        registration_start_date:
          type: string
          format: date
          nullable: true
        registration_end_date:
          type: string
          format: date
          nullable: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
        parent_label:
          type: string
          nullable: true
          readOnly: true
        timezone:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicTermStatusEnum'
          readOnly: true
      required:
      - academic_term_id
      - academic_year_id
      - actions
      - end_date
      - parent_label
      - start_date
      - status
      - term_code
      - term_name
      - term_type
      - timezone
    AcademicTermStatusEnum:
      enum:
      - PLANNED
      - REGISTRATION_OPEN
      - ACTIVE
      - CLOSED
      type: string
      description: |-
        * `PLANNED` - Planned
        * `REGISTRATION_OPEN` - Registration Open
        * `ACTIVE` - Active
        * `CLOSED` - Closed
    AcademicYear:
      type: object
      properties:
        academic_year_id:
          type: integer
          readOnly: true
        year_code:
          type: string
          maxLength: 9
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        actions:
          type: array
          items:
            type: string
          readOnly: true
        parent_label:
          type: string
          nullable: true
          readOnly: true
        timezone:
          type: string
          nullable: true
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicYearStatusEnum'
          readOnly: true
      required:
      - academic_year_id
      - actions
      - end_date
      - parent_label
      - start_date
      - status
      - timezone
      - year_code
    AcademicYearStatusEnum:
      enum:
      - PLANNED
      - ACTIVE
      - CLOSED
      type: string
      description: |-
        * `PLANNED` - Planned
        * `ACTIVE` - Active
        * `CLOSED` - Closed
    AcceptBody:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 100
      required:
      - token
    AcceptCandidate:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        pk:
          type: integer
          minimum: 1
        expected_version:
          type: integer
          minimum: 1
        candidate_index:
          type: integer
          maximum: 2
          minimum: 0
          default: 0
      required:
      - expected_version
      - pk
      - reason
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    AccountBody:
      type: object
      properties:
        active:
          type: boolean
        email:
          type: string
          format: email
        reason:
          type: string
          maxLength: 250
      required:
