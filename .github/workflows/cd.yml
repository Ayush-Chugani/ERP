name: CD
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
  migrate-and-smoke:
    needs: images
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Apply migrations
        working-directory: backend
        env:
          SIMS_DATABASE_URL: ${{ secrets.SIMS_DATABASE_URL }}
          SIMS_SECRET_KEY: ${{ secrets.SIMS_SECRET_KEY }}
          SIMS_ENV: production
        run: uv sync --frozen && uv run python -m app.cli migrate
      - name: Smoke test (after your platform rolls out the new images)
        run: curl --fail --retry 10 --retry-delay 6 "${{ vars.SIMS_PUBLIC_URL }}/api/v1/health/ready"
