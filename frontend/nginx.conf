# Serves the static single-page app and forwards /api to the FastAPI service on the same origin, so the browser needs
# no CORS and the refresh cookie stays first-party. TLS terminates in front of this container (load balancer / proxy).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # MUI (Emotion) injects inline <style>; scripts remain locked to this origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  client_max_body_size 12m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

  location /api/ {
    set $upstream http://api:8000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;
  }

  # Hashed build assets are immutable; the HTML shell must always be revalidated.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
