  /api/v1/reference/admission-categories/:
    get:
      operationId: reference_admission_categories_list
      description: Requires the model view permission. Visibility is filtered before
        counts and pagination. Defaults to active rows with active ancestors. Page
        size defaults to 25 and is capped at 100; primary key breaks ordering ties.
      parameters:
      - in: query
        name: is_active
        schema:
          type: string
          enum:
          - all
          - 'false'
          - 'true'
        description: Default true includes active ancestors. false/all require maintenance
          authority.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Comma-separated allowlist: admission_category_id, category_code,
          category_name, description, is_active'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: 'Case/accent-insensitive substring search over: category_code,
          category_name, description. Maximum 150 characters.'
      tags:
      - reference
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdmissionCategoryList'
          description: ''
    post:
      operationId: reference_admission_categories_create
      description: Requires model add permission AND common_reference.maintain_reference.
