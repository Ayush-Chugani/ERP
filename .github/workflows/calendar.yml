name: SIMS module verification
on:
  workflow_dispatch:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/calendar.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/calendar.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: disposable-ci-password
          MYSQL_DATABASE: sims_calendar_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdisposable-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DJANGO_SECRET_KEY: disposable-ci-only-secret-not-for-deployment-123456789
      DJANGO_SETTINGS_MODULE: config.settings.test
      SIMS_DB_NAME: sims_calendar_ci
      SIMS_DB_USER: root
      SIMS_DB_PASSWORD: disposable-ci-password
      SIMS_DB_HOST: 127.0.0.1
      SIMS_DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r backend/requirements-dev.in
      - run: npm --prefix frontend ci
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py check --database default
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python -m ruff check backend/apps/academic_calendar backend/apps/curriculum_catalog backend/apps/people_master --select E9,F63,F7,F82
      - run: python -m ruff check backend/apps/communication backend/apps/documents_exit/sharing.py
      - run: python -m pytest backend/apps --cov=apps.academic_calendar --cov=apps.curriculum_catalog --cov=apps.people_master --cov-fail-under=80 --cov-report=term
      - run: python backend/manage.py spectacular --file /tmp/sims-schema.yaml --validate --fail-on-warn
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:ui
      - run: npm --prefix frontend run build
